<html lang="ru" id="page">
<head>

</head>

<body>
  <header class="site-header">
    <a class="logo" href="#top" aria-label="Vespa Kazakhstan Club">
      <img src="assets/images/vespa-logo.png" alt="Логотип Vespa Kazakhstan Club">
    </a>

    <a class="header-instagram" href="https://www.instagram.com/vespakazakhstan/" target="_blank" rel="noopener noreferrer">
      Мы в Instagram
    </a>

    <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav">
      <a href="#about">О КЛУБЕ</a>
      <a href="#history">ИСТОРИЯ</a>
      <a href="#events">СОБЫТИЯ</a>
      <a href="#gallery">ГАЛЕРЕЯ</a>
      <a href="#birthdays">ДНИ РОЖДЕНИЯ</a>
      <a href="#charter">УСТАВ</a>
      <a href="#contacts">КОНТАКТЫ</a>
      <!-- ДОБАВЛЯЕМ КНОПКУ ENGLISH ЗДЕСЬ -->
      <a href="#" class="english-btn">ENGLISH</a>
    </nav>
  </header>

  <!-- ... остальной ваш HTML остаётся без изменений ... -->

  <!-- Google Translate виджет (только один раз) -->
  <div id="google_translate_element" style="display: none;"></div>

  <script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'ru',
      includedLanguages: 'en',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    // Стили для кнопки ENGLISH
    const style = document.createElement('style');
    style.textContent = `
      .english-btn {
        display: inline-block;
        padding: 8px 16px;
        background: #f8f8f8;
        border: 1px solid #e0e0e0;
        border-radius: 20px;
        color: #333;
        font-family: 'Arial', sans-serif;
        font-size: 14px;
        font-weight: bold;
        margin-left: 20px;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .english-btn:hover {
        background: #f0f0f0;
        border-color: #d0d0d0;
      }
      .goog-te-gadget {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
      .goog-te-combo {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    `;
    document.head.appendChild(style);

    // Обработчик для кнопки ENGLISH
    const englishBtn = document.querySelector('.english-btn');
    if (englishBtn) {
      englishBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = 'en';
          select.dispatchEvent(new Event('change'));
        }
      });
    }
  });
  </script>

  <!-- ... ваш существующий script.js ... -->
</body>
</html>
